name: RPGMoney
main: beer.devs.rpgmoney.Main
author: LoneDev
version: 1.4.0
api-version: '1.21.4'
depend:
  - Vault
softdepend:
  - ItemsAdder
commands:
  rpgmoney:
    description: "Main plugin command"
    usage: /rm
    aliases: [ rm, rmoney ]
permissions:
  rpgmoney.pickup:
    description: "Permission to pickup money"
    default: op
  rpgmoney.reload:
    description: "Permission to reload the plugin"
    default: op
  rpgmoney.get:
    description: "Permission to get your money as physical currency"
    default: op
